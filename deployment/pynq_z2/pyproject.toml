[project]
name = "horn-algorithm"
version = "1.0.0"
description = "Fixed-weight vehicle horn inference and reproducible replay"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
