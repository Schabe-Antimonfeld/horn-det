[project]
name = "horn-prototype"
version = "0.1.0"
description = "Document-aligned vehicle horn detection and localization reference"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1"]

[project.optional-dependencies]
learning = ["torch>=2.6,<3", "scikit-learn>=1.5,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
